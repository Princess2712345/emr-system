# Render Blueprint — deploys the Nuxt/Nitro server + a managed PostgreSQL DB.
# Docs: https://render.com/docs/blueprint-spec
#
# To deploy:
#   1. Push this repo to GitHub (already at ErmanDev/nuxtjs-template).
#   2. On Render: New > Blueprint > pick this repo. Render reads this file.
#   3. Render provisions the database, injects DATABASE_URL, builds the
#      Dockerfile, runs `prisma migrate deploy`, and starts the server.

databases:
  - name: emr-db
    databaseName: emr_db
    user: emr
    plan: free

services:
  - type: web
    name: emr-system
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: emr-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: NITRO_HOST
        value: 0.0.0.0
      - key: NITRO_PORT
        value: 3000
